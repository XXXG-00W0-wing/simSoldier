services:
  db:
    image: postgres:15
    container_name: simsoldier_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simsoldier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z # Added :Z for SELinux
      - ./backend/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: simsoldier_backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/simsoldier
      SECRET_KEY: your_super_secret_key_change_me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data:ro
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    container_name: simsoldier_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
      - "8443:443"
    command: >
      /bin/sh -c "apk add --no-cache openssl &&  openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/cert.key -out /etc/nginx/cert.crt -subj '/CN=localhost' &&  echo ' server {
          listen 80;
          listen 443 ssl;
          ssl_certificate /etc/nginx/cert.crt;
          ssl_certificate_key /etc/nginx/cert.key;
          location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
          }
          location / {
              root /usr/share/nginx/html;
              index index.html;
              try_files $$uri $$uri/ /index.html;
          }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - backend

volumes:
  postgres_data:
